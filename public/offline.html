<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Sem conexão — Aposentadoria</title>
  <style>
    :root { --bg:#f6f6f3; --surface:#fff; --fg:#18181b; --muted:#6b6b73; --line:#e5e5e0; --accent:#0f766e; --accent-fg:#fff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d0f0f; --surface:#161919; --fg:#f1f2f1; --muted:#9ba3a1; --line:#2a2f2e; --accent:#2dd4bf; --accent-fg:#062b27; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width:380px; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:32px 24px; }
    .logo { width:56px; height:56px; border-radius:14px; background:var(--accent); display:grid; place-items:center; margin:0 auto 16px; }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    p { margin:0 0 20px; color:var(--muted); font-size:.95rem; line-height:1.5; }
    button { font:inherit; font-weight:600; font-size:1rem; border:0; border-radius:10px; padding:11px 20px; background:var(--accent); color:var(--accent-fg); cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
    </div>
    <h1>Você está sem conexão</h1>
    <p>O simulador precisa de internet para carregar o seu plano. Conecte-se e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
